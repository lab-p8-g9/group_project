<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Email</title>

    <link rel="stylesheet" type="text/css" href="../static/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Darker+Grotesque:wght@300..900&family=Playwrite+IT+Trad:wght@100..400&display=swap"
          rel="stylesheet">
</head>

<body class="email-page">

     <div class="email-topbar">
        <a class="email-logout" href="{{ url_for('home') }}">Log out</a>
    </div>
    <main class="email-card">

        <div class="email-heading">
            <h1>Please Input your Issue below:</h1>
        </div>

        <form action="./submitComplaint" method="POST">

            <div class="email-field">
                <label for="user_email">Email:</label>
                <input type="email" id="user_email" name="user_email" required>
            </div>

            <div class="email-field">
                <label for="subject">Subject:</label>
                <input type="text" id="subject" name="subject" required>
            </div>

            <div class="email-field">
                <label for="user_complaint">Complaint:</label>
                <textarea id="user_complaint" name="user_complaint" rows="4" cols="50" required></textarea>
            </div>

            <button type="submit">Submit</button>

        </form>

    </main>

</body>
</html>
