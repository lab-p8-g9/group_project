name: Docker CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t inf1103_project_part2 .

      - name: Run IO Manager Unit Tests
        run: docker run --rm inf1103_project_part2 python -m unittest IO_manager/io_test.py

      - name: Run Logic Deadline Tests
        run: docker run --rm inf1103_project_part2 python Logic_manager/logic_test_script.py

      - name: Run Logic Valid AI Sample Tests
        run: docker run --rm inf1103_project_part2 python -m Logic_manager.valid_sample_script

      - name: Run Logic Invalid AI Sample Tests
        run: docker run --rm inf1103_project_part2 python -m Logic_manager.invalid_sample_script

      - name: Run Offline AI Manager Test
        run: docker run --rm inf1103_project_part2 python -c "from AI_manager.ai_test import test_offline_ai; test_offline_ai()"