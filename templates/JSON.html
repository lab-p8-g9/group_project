<!DOCTYPE html>
<html>
    <head>
        <title>Load Table</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    </head>
    <body>
        <h1>Complaints</h1>
        <table>
            <tr>
                <th>ComplaintID</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Content</th>
                <th>Datetime</th>
            </tr>
            {% for rows in data %}
            <tr>
                <td>{{ rows.ComplaintID }}</td>
                <td>{{ rows.Email }}</td>
                <td>{{ rows.Subject }}</td>
                <td>{{ rows.Content }}</td>
                <td>{{ rows.Datetime }}</td>
            </tr>
            {% endfor %}
        </table>
        <button onclick="history.back();">Go Back</button>
        <form action="{{ url_for('accountPage') }}" method="get">
            <button type="submit">Go to Account</button>
        </form>
    </body>
</html>
