<!DOCTYPE html>
<html>
    <head>
        <title>Customer Login</title>
        <link rel="stylesheet" type="text/css" href="../static/style.css">
    </head>
    <body>
        <div id="loginFormContainer">
            <div>
                <h3>Welcome!</h3>
                <p>Login to your account</p>
                <form id="loginForm" action="./Account" method="POST">
                    <label for="user_email">Email</label>
                    <br>
                    <input placeholder="Type your email" type="email" id="user_email" name="user_email" required><br><br>
                    <label for="user_password">Password</label>
                    <br>
                    <input placeholder="Type your password" type="password" id="user_password" name="user_password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[!@#$%^&*(),.?\x22\x27:{}|<>]).{8,}" required><br><br>
                    <button id="loginbtn" name="action" type="submit" value="login">Login</button>
                    <div class="dashed-text-container">
                        <p id="acctext">No account?</p>
                    </div>
                    <button id="signupbtn" name="action" type="submit" value="signup">Sign up</button>
                </form>
                <a href="{{ url_for('employeeLoginPage') }}"><button id="employeeLogin">Are you an employee?</button></a>
            </div>
        </div>
    </body>
</html>
